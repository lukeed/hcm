name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  TAG: ${{ inputs.tag || github.ref_name }}
  HC_MIN: 0.1.18

defaults:
  run:
    shell: bash

jobs:
  cli:
    name: cli ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, run: true }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true, run: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: rust zig github:rust-cross/cargo-zigbuild
          cache: false

      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hcm") | .version')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match hcm $version"; exit 1; }

      - run: rustup target add "$TARGET"

      - name: Build
        env:
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = true ]; then
            cargo zigbuild --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi

      - name: Smoke test
        if: matrix.run
        run: |
          file "$CARGO_TARGET_DIR/$TARGET/release/hcm"
          "$CARGO_TARGET_DIR/$TARGET/release/hcm" --help | head -1

      # The archive holds the executable alone, at its root, so that a
      # consumer reading `bin` from the packslip finds it where it says.
      - name: Package
        env:
          COPYFILE_DISABLE: 1
        run: |
          archive="hcm-$TARGET.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C "$CARGO_TARGET_DIR/$TARGET/release" hcm
          cd dist && shasum -a 256 "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber

      # Signs the archives and their digests with this workflow's identity, so
      # an installer can verify what it downloads instead of trusting a name.
      - uses: jdx/packslip@e0340e0c1d10c90a434de2b90f3a1ba345923564 # v1.11.4
        with:
          artifacts: dist/*.tar.gz
          bin: hcm
          require: bin:hc@${{ env.HC_MIN }}
          tag: ${{ env.TAG }}
          commit: ${{ steps.source.outputs.commit }}
