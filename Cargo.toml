[package]
name = "hcm"
description = "Move Herdr TUI workspaces into herdr-core (hc)"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/lukeed/hcm"
publish = false

[dependencies]
doc = { package = "rodeo-doc", git = "https://github.com/lukeed/rodeo", tag = "v0.2.0" }
hc = { package = "rodeo-hc", git = "https://github.com/lukeed/rodeo", tag = "v0.2.0" }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "macros"] }

[dev-dependencies]
hc = { package = "rodeo-hc", git = "https://github.com/lukeed/rodeo", tag = "v0.2.0", features = ["testing"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
